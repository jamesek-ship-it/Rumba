<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rumbo Español</title>
<meta name="description" content="Conversational Spanish for travel in Mexico, Ecuador and Colombia, with a phrasebook, short conversations and speaking practice.">
<meta name="theme-color" content="#F1F4F9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0D1425" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Rumbo">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Public+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
:root { color-scheme: light; }

/* Layout: one centered column, top tab bar, a four-step level ladder (A1 to B2) as the signature element. */
:root {
  --bg: #F1F4F9;
  --surface: #FFFFFF;
  --ink: #12203A;
  --muted: #55627D;
  --line: #D6DCE8;
  --accent: #2748D4;
  --accent-ink: #FFFFFF;
  --accent-soft: #E2E8FB;
  --sun: #F2B33D;
  --sun-soft: #FCEFCF;
  --good: #187A4D;
  --good-soft: #DDF3E7;
  --bad: #BE3027;
  --bad-soft: #FADFDC;
  --font-display: "Bricolage Grotesque", "Trebuchet MS", system-ui, sans-serif;
  --font-body: "Public Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0D1425; --surface: #151D33; --ink: #E7ECF7; --muted: #9AA6C2; --line: #29334F;
    --accent: #8AA2FF; --accent-ink: #0D1425; --accent-soft: #212D57; --sun: #F4C35C; --sun-soft: #3A3018;
    --good: #55CC90; --good-soft: #15332A; --bad: #FF8178; --bad-soft: #43201F; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0D1425; --surface: #151D33; --ink: #E7ECF7; --muted: #9AA6C2; --line: #29334F;
  --accent: #8AA2FF; --accent-ink: #0D1425; --accent-soft: #212D57; --sun: #F4C35C; --sun-soft: #3A3018;
  --good: #55CC90; --good-soft: #15332A; --bad: #FF8178; --bad-soft: #43201F; color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { min-height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 16px; line-height: 1.5; padding-inline: 16px; padding-block: 0 48px; }
.wrap { max-width: 760px; margin-inline: auto; }
h1, h2, h3 { font-family: var(--font-display); line-height: 1.1; margin: 0; text-wrap: balance; letter-spacing: -0.01em; }
p { margin: 0; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 6px; }

/* top bar */
.bar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px 24px; padding-block: 20px 12px; }
.brand { font-family: var(--font-display); font-weight: 800; font-size: 1.45rem; letter-spacing: -0.02em; display: flex; align-items: baseline; gap: 6px; }
.brand i { font-style: normal; color: var(--accent); }
.tabs { display: flex; gap: 4px; background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 4px; }
.tab { border: 0; background: transparent; padding: 7px 16px; border-radius: 999px; font-weight: 600; font-size: 0.9rem; color: var(--muted); }
.tab[aria-current="page"] { background: var(--ink); color: var(--bg); }
.tab:not([aria-current="page"]):hover { color: var(--ink); }

.trip { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; padding-block: 4px; }
.trip .lbl { font-family: var(--font-mono); font-size: 0.75rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); margin-right: 4px; }
.chip { border: 1.5px solid var(--line); background: var(--surface); border-radius: 999px; padding: 7px 16px; font-weight: 600; font-size: 0.9rem; min-height: 40px; }
.chip:hover { border-color: var(--accent); }
.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.chip small { font-family: var(--font-mono); font-weight: 600; font-size: 0.7rem; opacity: 0.75; margin-left: 6px; }
main { display: flex; flex-direction: column; gap: 20px; padding-top: 12px; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 24px; display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.eyebrow { font-family: var(--font-mono); font-size: 0.75rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.lede { color: var(--muted); max-width: 60ch; }
h1 { font-size: clamp(2rem, 6vw, 2.9rem); }
h2 { font-size: 1.5rem; }
h3 { font-size: 1.1rem; }

.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 11px 18px; font-weight: 600; min-height: 44px; }
.btn:hover { border-color: var(--ink); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.quiet { border-color: transparent; background: transparent; color: var(--muted); text-decoration: underline; text-underline-offset: 3px; }
.btn[disabled] { opacity: 0.5; cursor: not-allowed; }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }

/* level ladder */
.ladder { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.rung { border-radius: 10px; padding: 10px 12px 12px; background: var(--bg); border: 1px solid var(--line); display: flex; flex-direction: column; gap: 2px; min-width: 0; position: relative; }
.rung b { font-family: var(--font-mono); font-size: 1.05rem; }
.rung span { font-size: 0.75rem; color: var(--muted); line-height: 1.25; }
.rung.done { background: var(--accent-soft); border-color: transparent; }
.rung.here { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.rung.here span { color: var(--accent-ink); opacity: 0.85; }
.rung.here::after { content: "Tú estás aquí"; position: absolute; top: -9px; right: 8px; background: var(--sun); color: #1b1608; font-size: 0.65rem; font-weight: 700; padding: 1px 8px; border-radius: 999px; white-space: nowrap; }

/* test */
.meter { display: flex; gap: 4px; }
.meter i { flex: 1; height: 6px; border-radius: 3px; background: var(--line); }
.meter i.on { background: var(--accent); }
.meter i.ok { background: var(--good); }
.meter i.no { background: var(--bad); }
.qprompt { font-family: var(--font-display); font-weight: 700; font-size: clamp(1.3rem, 4vw, 1.7rem); line-height: 1.2; text-wrap: balance; }
.opts { display: grid; gap: 10px; }
.opt { display: flex; gap: 12px; align-items: center; text-align: left; border: 1.5px solid var(--line); background: var(--surface); border-radius: 12px; padding: 12px 14px; min-height: 52px; }
.opt .k { font-family: var(--font-mono); font-size: 0.8rem; width: 26px; height: 26px; flex: none; display: grid; place-items: center; border-radius: 7px; background: var(--bg); color: var(--muted); }
.opt:hover:not([disabled]) { border-color: var(--accent); }
.opt.right { border-color: var(--good); background: var(--good-soft); }
.opt.wrong { border-color: var(--bad); background: var(--bad-soft); }
.opt[disabled] { cursor: default; }
.note { border-radius: 12px; padding: 12px 14px; font-size: 0.95rem; }
.note.ok { background: var(--good-soft); }
.note.no { background: var(--bad-soft); }
.note.info { background: var(--sun-soft); }

/* decks */
.group { display: flex; flex-direction: column; gap: 10px; }
.decks { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 10px; }
.deck { text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 14px; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.deck:hover { border-color: var(--accent); }
.deck.mine { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.deck .t { font-family: var(--font-display); font-weight: 700; font-size: 1.1rem; }
.deck .s { font-size: 0.85rem; color: var(--muted); }
.bar-m { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; }
.bar-m i { display: block; height: 100%; background: var(--good); }
.tag { font-family: var(--font-mono); font-size: 0.7rem; font-weight: 600; padding: 2px 8px; border-radius: 999px; background: var(--accent-soft); color: var(--ink); align-self: flex-start; }
.tag.sun { background: var(--sun); color: #1b1608; }

/* flashcard */
.card { border: 1.5px solid var(--line); border-radius: 18px; min-height: 240px; padding: 24px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; text-align: center; background: var(--bg); width: 100%; }
.card:hover { border-color: var(--accent); }
.card .es { font-family: var(--font-display); font-weight: 800; font-size: clamp(2rem, 8vw, 3rem); line-height: 1.05; overflow-wrap: anywhere; }
.card .en { font-size: 1.25rem; font-weight: 600; color: var(--accent); }
.card .ex { color: var(--muted); font-style: italic; max-width: 40ch; }
.card .hint { font-family: var(--font-mono); font-size: 0.75rem; color: var(--muted); letter-spacing: 0.06em; text-transform: uppercase; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; align-self: flex-start; }
.seg button { border: 0; background: transparent; padding: 8px 16px; font-weight: 600; font-size: 0.9rem; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }

/* progress */
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; }
.stat { border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; display: flex; flex-direction: column; gap: 2px; }
.stat b { font-family: var(--font-display); font-size: 1.9rem; line-height: 1; font-variant-numeric: tabular-nums; }
.stat span { font-size: 0.8rem; color: var(--muted); }
.list { display: flex; flex-direction: column; gap: 8px; margin: 0; padding: 0; list-style: none; }
.list li { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 4px 12px; padding: 10px 0; border-top: 1px solid var(--line); font-size: 0.95rem; }
.list li:first-child { border-top: 0; }
.mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.scores { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.scores div { border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; display: flex; flex-direction: column; }
.scores b { font-family: var(--font-mono); font-size: 0.8rem; color: var(--muted); }
.scores span { font-family: var(--font-display); font-weight: 700; font-size: 1.3rem; font-variant-numeric: tabular-nums; }
@media (max-width: 520px) {
  .panel { padding: 18px; }
  .rung span { display: none; }
  .tab { padding: 7px 12px; }
}
@media (prefers-reduced-motion: no-preference) {
  .card, .opt, .deck, .btn { transition: border-color .15s, background-color .15s, filter .15s; }
}

/* account */
.field { display: flex; flex-direction: column; gap: 6px; }
.field label { font-weight: 600; font-size: 0.9rem; }
.field input { font: inherit; color: var(--ink); background: var(--bg); border: 1.5px solid var(--line); border-radius: 10px; padding: 11px 12px; min-height: 46px; width: 100%; }
.field input:focus-visible { border-color: var(--accent); outline-offset: 0; }
.field small { color: var(--muted); }
.dot { width: 9px; height: 9px; border-radius: 50%; background: var(--muted); display: inline-block; margin-right: 7px; }
.dot.ok { background: var(--good); } .dot.pending, .dot.syncing { background: var(--sun); } .dot.error { background: var(--bad); }
.btn.danger { border-color: var(--bad); color: var(--bad); }
.btn.danger.solid { background: var(--bad); color: #fff; }
form { display: flex; flex-direction: column; gap: 14px; margin: 0; }
/* standalone page base */
html { background: var(--bg); }
body { margin: 0; -webkit-text-size-adjust: 100%; padding-top: max(0px, env(safe-area-inset-top)); padding-bottom: calc(48px + env(safe-area-inset-bottom)); }
.mic { min-width: 150px; }
.mic.live { background: var(--bad); border-color: var(--bad); color: #fff; }
@media (prefers-reduced-motion: no-preference) { .mic.live { animation: pulse 1.2s ease-in-out infinite; } }
@keyframes pulse { 50% { box-shadow: 0 0 0 8px color-mix(in srgb, var(--bad) 25%, transparent); } }

/* v3: bottom nav, welcome, phrasebook, show-it, scenes, plan */
body { padding-bottom: calc(92px + env(safe-area-inset-bottom)); }
body.onb { padding-bottom: calc(24px + env(safe-area-inset-bottom)); }
.nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; display: flex; justify-content: center; gap: 2px; background: var(--surface); border-top: 1px solid var(--line); padding: 6px 8px calc(6px + env(safe-area-inset-bottom)); }
.nav button { flex: 1; max-width: 120px; border: 0; background: transparent; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 6px 2px; font-size: 0.72rem; font-weight: 600; color: var(--muted); min-height: 54px; border-radius: 10px; }
.nav svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.nav button[aria-current="page"] { color: var(--accent); background: var(--accent-soft); }
body.onb .nav, body.onb .trip, body.onb .bar { display: none; }
.noscroll { overflow: hidden; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.row.between { justify-content: space-between; }
.inl { padding: 0 4px; min-height: 0; display: inline; }
.s { font-size: 0.85rem; color: var(--muted); }
.ex { color: var(--muted); font-style: italic; }
.field input[type=search] { -webkit-appearance: none; appearance: none; }

.welcome { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 18px; max-width: 460px; width: 100%; margin-inline: auto; padding-block: 7vh 8px; }
.welcome .lede { margin-inline: auto; }
.mark { width: 76px; height: 76px; border-radius: 20px; background: #2748D4; color: #fff; display: grid; place-items: center; font-family: var(--font-display); font-weight: 800; font-size: 3rem; box-shadow: inset 0 -8px 0 #F2B33D; }
.bigs { display: grid; gap: 10px; width: 100%; text-align: left; }
.big { display: flex; flex-direction: column; gap: 2px; align-items: flex-start; border: 1.5px solid var(--line); background: var(--surface); border-radius: 14px; padding: 16px 18px; min-height: 68px; }
.big:hover { border-color: var(--accent); }
.big b { font-family: var(--font-display); font-size: 1.2rem; }
.big span { color: var(--muted); font-size: 0.9rem; }
.big .tag { margin-bottom: 4px; color: var(--ink); }

.levelrow { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.plan { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.step { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-top: 1px solid var(--line); }
.step:first-child { border-top: 0; }
.chk { width: 26px; height: 26px; border-radius: 50%; border: 2px solid var(--line); flex: none; display: grid; place-items: center; }
.step.done .chk { background: var(--good); border-color: var(--good); }
.step.done .chk::after { content: "✓"; color: #fff; font-weight: 700; font-size: 0.85rem; }
.stx { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.stx span { color: var(--muted); font-size: 0.85rem; }

.pcat { margin-top: 14px; font-size: 0.95rem; color: var(--muted); font-family: var(--font-mono); text-transform: uppercase; letter-spacing: 0.06em; }
.prow { display: flex; align-items: stretch; border-top: 1px solid var(--line); }
.pshow { flex: 1; min-width: 0; text-align: left; background: transparent; border: 0; padding: 12px 0; display: flex; flex-direction: column; gap: 2px; }
.pes { font-family: var(--font-display); font-weight: 700; font-size: 1.15rem; line-height: 1.2; }
.pen { color: var(--muted); font-size: 0.9rem; }
.star { width: 52px; border: 0; background: transparent; display: grid; place-items: center; }
.star svg { width: 24px; height: 24px; fill: none; stroke: var(--muted); stroke-width: 1.8; stroke-linejoin: round; }
.star[aria-pressed="true"] svg { fill: var(--sun); stroke: var(--sun); }
.blank { display: inline-block; width: 2.2em; border-bottom: 2px solid currentColor; margin-inline: 3px; }

.show { position: fixed; inset: 0; z-index: 50; background: #2748D4; color: #fff; display: flex; flex-direction: column; padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom); }
.show[hidden] { display: none; }
.show-top { display: flex; justify-content: space-between; align-items: center; padding: 14px 16px; }
.show-body { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; padding: 16px 22px; gap: 22px; overflow: auto; }
.show-es { font-family: var(--font-display); font-weight: 800; font-size: clamp(2.2rem, 11vw, 4.6rem); line-height: 1.05; overflow-wrap: anywhere; text-wrap: balance; }
.show-en { font-size: 1.2rem; opacity: 0.85; }
.show .blank { border-color: #F2B33D; }
.show-bar { display: flex; gap: 10px; padding: 14px 16px 18px; }
.show-btn { flex: 1; border: 2px solid rgba(255,255,255,.55); background: transparent; color: #fff; border-radius: 12px; padding: 12px 16px; min-height: 52px; font-weight: 700; }
.show-top .show-btn { flex: none; min-height: 44px; padding: 8px 16px; }
.show-btn.solid { background: #fff; color: #2748D4; border-color: #fff; }
.show-btn[disabled] { opacity: 0.4; }
.show :focus-visible { outline-color: #fff; }

.bubble { border-radius: 16px; padding: 16px; background: var(--accent-soft); display: flex; flex-direction: column; gap: 10px; }
.btext { font-family: var(--font-display); font-weight: 700; font-size: 1.4rem; line-height: 1.2; }
.btext.hid { color: var(--muted); letter-spacing: 0.3em; }
.ben { color: var(--muted); font-style: italic; }

</style>
</head>
<body>
<div class="wrap">
  <header class="bar">
    <div class="brand">Rumbo<i>Español</i></div>
  </header>
  <div class="trip" id="trip" role="group" aria-label="Destino"></div>
  <main id="app"></main>
</div>
<nav class="nav" id="nav" aria-label="Secciones"></nav>
<div class="show" id="show" hidden role="dialog" aria-modal="true" aria-label="Frase"></div>
<script src="vendor/supabase.js"></script>
<script>
(function () {
  "use strict";
  var LEVELS = ["A1", "A2", "B1", "B2"];
  var LEVEL_NAMES = { A1: "Principiante", A2: "Elemental", B1: "Intermedio", B2: "Intermedio alto" };
  var LEVEL_EN = { A1: "Beginner", A2: "Elementary", B1: "Intermediate", B2: "Upper intermediate" };

  /* ---------- Placement questions: five per level ---------- */
  var BANK = {
    A1: [
      { q: "How do you say “good morning”?", o: ["Buenas noches", "Buenos días", "Hasta luego", "Gracias"], a: 1, why: "“Buenos días” is used until about midday. “Buenas noches” is for the evening and night." },
      { q: "Yo ___ de Michigan.", o: ["soy", "eres", "es", "son"], a: 0, why: "“Soy” is the “yo” form of ser: Yo soy de Michigan." },
      { q: "What does “la casa” mean?", o: ["the car", "the house", "the dog", "the table"], a: 1, why: "La casa = the house. Casa is feminine, so it takes “la”." },
      { q: "Which word means “seven”?", o: ["seis", "siete", "ocho", "nueve"], a: 1, why: "Seis 6, siete 7, ocho 8, nueve 9." },
      { q: "Ella ___ agua.", o: ["bebo", "bebes", "bebe", "beben"], a: 2, why: "“Ella” takes the third-person singular: ella bebe." }
    ],
    A2: [
      { q: "Ayer yo ___ al supermercado.", o: ["voy", "fui", "iré", "voy a ir"], a: 1, why: "“Ayer” (yesterday) calls for the past. Fui is the preterite of ir: yo fui." },
      { q: "Me gusta ___ en el parque.", o: ["caminar", "camino", "caminas", "caminó"], a: 0, why: "After “me gusta” you use the infinitive: me gusta caminar." },
      { q: "What does “¿Cuánto cuesta?” mean?", o: ["Where is it?", "What time is it?", "How much does it cost?", "How long does it take?"], a: 2, why: "Cuánto cuesta = how much does it cost." },
      { q: "Mi hermana es ___ que yo.", o: ["alta más", "tan alta", "más alta", "muy alta"], a: 2, why: "Comparisons use “más + adjective + que”: más alta que yo." },
      { q: "Read: “Hoy hace frío y llueve. Voy a llevar un paraguas.” What will the speaker take?", o: ["a hat", "an umbrella", "sunscreen", "sandals"], a: 1, why: "Un paraguas is an umbrella, and it is raining (llueve)." }
    ],

      var sc = cardR(deck, P.queue[P.pos]), sp = P.sp, hasSent = !!sc[2], read = P.spMode === "read" && hasSent;
      var showAns = sp.passed || sp.revealed || sp.tries >= 2;
      var segm = hasSent ? '<div class="seg" role="group" aria-label="Tipo de práctica"><button data-spmode="recall" aria-pressed="' + !read + '">Recall</button><button data-spmode="read" aria-pressed="' + read + '">Read aloud</button></div>' : "<span></span>";
      var ask = read
        ? '<div class="eyebrow">Read this aloud</div><div class="qprompt">' + blanks(esc(sc[2])) + '</div>'
        : '<div class="eyebrow">Say it in Spanish</div><div class="qprompt">' + blanks(esc(sc[1])) + '</div>';
      var ans = showAns && !read ? '<div class="note info"><b>' + blanks(esc(sc[0])) + '</b>' + (sc[2] ? '<br><span class="ex">' + esc(sc[2]) + '</span>' : "") + '</div>' : "";
      var fbk = "";
      if (sp.err) fbk = '<div class="note no">' + esc(SP_ERR[sp.err] || ("Speech recognition stopped (" + sp.err + ")."))  + '</div>';
      else if (sp.heard !== null) {
        var cls = sp.passed ? "ok" : (sp.score >= CLOSE ? "info" : "no");
        var verdict = sp.passed ? "Muy bien. " : (sp.score >= CLOSE ? "Casi. " : "Otra vez. ");
        fbk = '<div class="note ' + cls + '"><b>' + verdict + '</b>Heard: “' + esc(sp.heard) + '”' +
          (!sp.passed && sp.missed.length ? '<br>Missing or different: ' + sp.missed.map(esc).join(", ") : "") + '</div>';
      }
      var mic = '<button class="btn primary mic' + (sp.listening ? " live" : "") + '" data-act="mic">' + (sp.listening ? "Escuchando…" : (sp.tries ? "Hablar otra vez" : "Hablar")) + '</button>';
      var more = '';
      if (sp.passed || sp.tries >= 2 || sp.revealed) more = '<button class="btn" data-act="spnext">Continuar</button>';
      else if (!read) more = '<button class="btn quiet" data-act="reveal">Show answer</button>';
      if (read && !sp.passed && sp.tries >= 1 && !more) more = '<button class="btn" data-act="spnext">Continuar</button>';
      return '<section class="panel">' + head + '<div class="row" style="justify-content:space-between">' + segm + '<span class="eyebrow">' + (P.pos + 1) + ' de ' + P.queue.length + '</span></div>' +
        ask + ans + fbk +
        '<div class="row">' + mic + (canSpeak ? '<button class="btn" data-act="say">Escuchar</button>' : "") + more + '</div>' + '</section>';
    }
    var prog = '<div class="eyebrow">' + (P.pos + 1) + ' de ' + P.queue.length + '</div>';
    if (P.mode === "flash") {
      var c = cardR(deck, P.queue[P.pos]);
      var face = P.flipped
        ? '<div class="es" style="font-size:1.6rem">' + blanks(esc(c[0])) + '</div><div class="en">' + blanks(esc(c[1])) + '</div>' + (c[2] ? '<div class="ex">' + esc(c[2]) + '</div>' : "")
        : '<div class="es">' + blanks(esc(c[0])) + '</div><div class="hint">Toca para ver la respuesta</div>';
      var act = P.flipped
        ? '<div class="row"><button class="btn" data-act="again">Otra vez</button><button class="btn primary" data-act="good">La sé</button>' + (canSpeak ? '<button class="btn quiet" data-act="say">Escuchar</button>' : "") + '</div>'
        : (canSpeak ? '<div class="row"><button class="btn quiet" data-act="say">Escuchar</button></div>' : "");
      return '<section class="panel">' + head + prog + '<button class="card" data-act="flip" aria-label="Voltear tarjeta">' + face + '</button>' + act + '</section>';
    }
    var cc = cardR(deck, P.q.i), ansd = P.picked !== null;
    var opts = P.q.opts.map(function (o, i) {
      var cls = ansd ? (o.ok ? " right" : (P.picked === i ? " wrong" : "")) : "";
      return '<button class="opt' + cls + '" data-qopt="' + i + '"' + (ansd ? " disabled" : "") + '><span class="k">' + "ABCD"[i] + '</span><span>' + esc(o.t) + '</span></button>';
    }).join("");
    var fb = ansd ? '<div class="note ' + (P.q.opts[P.picked].ok ? "ok" : "no") + '"><b>' + blanks(esc(cc[0])) + '</b>' + (cc[2] ? '<br><span class="ex">' + esc(cc[2]) + '</span>' : "") + '</div><div class="row"><button class="btn primary" data-act="qnext">Continue</button>' + (canSpeak ? '<button class="btn quiet" data-act="say">Escuchar</button>' : "") + '</div>' : "";
    return '<section class="panel">' + head + prog + '<div class="qprompt">¿Qué significa “' + blanks(esc(cc[0])) + '”?</div><div class="opts">' + opts + '</div>' + fb + '</section>';
  }

  /* ----- progress ----- */
  function progressView() {
    var learned = 0, total = 0;
    visibleDecks().forEach(function (d) { learned += mastered(d); total += d.cards.length; });
    var pl = S.placement, scenesDone = Object.keys(S.scenes).length;
    var rows = visibleDecks().map(function (d) {
      var m = mastered(d), n = d.cards.length;
      return '<li style="flex-direction:column;gap:6px"><div class="row" style="justify-content:space-between"><span><span class="mono" style="color:var(--muted)">' + (d.kind === "phrase" ? "TRIP" : d.lv) + '</span> ' + d.title + '</span><span class="mono">' + m + '/' + n + '</span></div><div class="bar-m" aria-hidden="true"><i style="width:' + Math.round(m / n * 100) + '%"></i></div></li>';
    }).join("");
    var hist = S.history.length ? S.history.slice().reverse().map(function (h) {
      var detail = h.scores && h.scores.length ? h.scores.reduce(function (a, b) { return a + b; }, 0) + "/" + h.scores.length + " quiz" : "chosen";
      return '<li><span>' + esc(h.date) + '</span><span class="mono">' + h.level + ' · ' + detail + '</span></li>';
    }).join("") : '<li><span style="color:var(--muted)">No level checks yet.</span></li>';
    var nudge = (A.sb && !A.user) ? '<div class="note info">Your progress is saved on this device only. <button class="btn quiet inl" data-go="account">Create an account</button> to keep it across devices.</div>' : "";
    return nudge + '<section class="panel"><div class="eyebrow">Progreso</div><h2>' + (pl ? "Nivel actual: " + pl.level : "Todavía sin nivel") + '</h2>' + (pl ? ladder(pl.level) : "") +
      '<div class="stats"><div class="stat"><b>' + learned + '/' + total + '</b><span>cards learned</span></div><div class="stat"><b>' + S.streak + '</b><span>day streak</span></div><div class="stat"><b>' + scenesDone + '/' + SCENES.length + '</b><span>scenes played</span></div></div></section>' +
      '<section class="panel"><h3>Dominio por mazo</h3><ul class="list">' + rows + '</ul></section>' +
      '<section class="panel"><h3>Tu nivel</h3><ul class="list">' + hist + '</ul>' +
      '<div class="row"><button class="btn" data-go="level">Change my level</button><button class="btn" data-act="start-test">Take the 5-question quiz</button></div></section>';
  }

  function render() {
    var onb = needsOnb();
    if (onb && view !== "test" && view !== "account") view = "home";
    document.body.classList.toggle("onb", onb || view === "test");
    renderNav(); renderTrip();
    var html;
    if (onb && view === "home") html = onboardView();
    else if (view === "home") html = homeView();
    else if (view === "test") html = testView();
    else if (view === "level") html = levelView();
    else if (view === "phrases") html = phrasesView();
    else if (view === "scenes") html = scenesView();
    else if (view === "study") html = studyView();
    else if (view === "account") html = accountView();
    else html = progressView();
    if (onb && view === "account") html = '<div><button class="btn quiet" data-go="home">Back</button></div>' + html;
    $("app").innerHTML = html;
    if (view === "home" && !onb && S.group && S.group.name) setTimeout(function () { loadGroup(false); }, 0);
  }

  /* ---------- Events ---------- */
  document.addEventListener("click", function (ev) {
    var el = ev.target.closest("[data-go],[data-act],[data-opt],[data-deck],[data-mode],[data-qopt],[data-country],[data-spmode],[data-amode],[data-level],[data-show],[data-fav],[data-scene],[data-sc-ask],[data-sc-you],[data-pbfav]");
    if (!el) return;
    var ds = el.dataset;
    if (ds.amode) {
      var ei = $("a-email"); if (ei) A.email = ei.value;
      A.mode = ds.amode; A.msg = null; render(); return;
    }
    if (ds.spmode && P) { stopRec(); P.spMode = ds.spmode; resetSp(); render(); return; }
    if (ds.country) { stopRec(); S.country = ds.country; P = null; SC = null; save(); render(); return; }
    if (ds.level) {
      S.placement = { level: ds.level, fresh: ds.level === "A1", date: today(), scores: [], t: Date.now(), via: "chosen" };
      S.history.push({ level: ds.level, date: today(), scores: [] });
      OB.pick = false; view = "home"; save(); render(); window.scrollTo(0, 0); return;
    }
    if (ds.go) {
      stopRec(); view = ds.go; if (view !== "study") P = null; if (view !== "scenes") SC = null;
      if (view === "test" && T && T.done) T = null;
      render(); window.scrollTo(0, 0); return;
    }
    if (ds.show !== undefined) { openShow(parseInt(ds.show, 10)); return; }
    if (ds.fav) {
      var k = ds.fav, ix = S.favs.indexOf(k);
      if (ix >= 0) S.favs.splice(ix, 1); else S.favs.push(k);
      var y = window.scrollY; save(); render(); window.scrollTo(0, y); return;
    }
    if (ds.pbfav !== undefined) { PB.fav = ds.pbfav === "1"; render(); return; }
    if (ds.scene) { startScene(ds.scene, false); window.scrollTo(0, 0); return; }
    if (ds.scAsk !== undefined && SC && SC.ask && !SC.ask.done) {
      var o = SC.ask.opts[parseInt(ds.scAsk, 10)];
      if (o.ok) { SC.ask.done = true; if (!SC.ask.tries) SC.points += 1; } else { o.wrong = true; SC.ask.tries += 1; }
      render(); return;
    }
    if (ds.scYou !== undefined && SC && SC.you && !SC.you.done) {
      var yi = parseInt(ds.scYou, 10), yo = SC.you.opts[yi];
      if (yo.ok) { SC.you.done = true; SC.you.picked = yi; if (!SC.you.tries) SC.points += 1; } else { yo.wrong = true; SC.you.tries += 1; }
      render(); return;
    }
    if (ds.deck) { openDeck(ds.deck, "flash", false); window.scrollTo(0, 0); return; }
    if (ds.mode && P) { openDeck(P.deck.id, ds.mode, P.all, P.synth); return; }
    if (ds.opt !== undefined) { answer(parseInt(ds.opt, 10)); return; }
    if (ds.qopt !== undefined && P && P.picked === null) {
      var i = parseInt(ds.qopt, 10); P.picked = i;
      var ok = P.q.opts[i].ok; if (ok) P.right += 1;
      gradeP(P.q.i, ok); render(); return;
    }
    switch (ds.act) {
      case "ob-pick": OB.pick = true; render(); break;
      case "ob-back": OB.pick = false; render(); break;
      case "ob-country": S.country = null; save(); render(); break;
      case "ob-quiz": case "start-test": startTest(); window.scrollTo(0, 0); break;
      case "quiz-exit": T = null; view = "home"; render(); window.scrollTo(0, 0); break;
      case "level-back": view = "home"; render(); break;
      case "test-done": T = null; view = "home"; render(); window.scrollTo(0, 0); break;
      case "test-pick": T = null; view = "level"; render(); window.scrollTo(0, 0); break;
      case "next-q": nextQ(); window.scrollTo(0, 0); break;
      case "edit-date": HOME.editDate = true; render(); break;
      case "cancel-date": HOME.editDate = false; render(); break;
      case "plan": {
        var step = ds.step;
        if (step === "review") {
          var rv = planReview(), refs = rv.refs;
          if (!refs.length) refs = shuffle(phraseRefs().filter(function (r) { return cardState(r.deck, r.i).seen; })).slice(0, 8);
          if (!refs.length) refs = shuffle(phraseRefs()).slice(0, 5);
          openSynth({ id: "plan-review", step: "review", title: "Frases del día", sub: "Today's phrases", refs: refs }, "flash");
        } else if (step === "speak") {
          var pool = phraseRefs().filter(function (r) { var c = cardR(r.deck, r.i); return !/\d|_{2,}/.test(c[0]); });
          var seen = pool.filter(function (r) { return cardState(r.deck, r.i).seen; });
          openSynth({ id: "plan-speak", step: "speak", title: "Dilo en voz alta", sub: "Say today's phrases out loud", refs: shuffle(seen.length >= 4 ? seen : pool).slice(0, 4) }, "speak");
        } else if (step === "scene") { startScene(ds.sceneId, true); }
        window.scrollTo(0, 0); break;
      }
      case "copy-link": {
        var inp = $("invite-url"), done = function () { el.textContent = "Copied"; setTimeout(function () { el.textContent = "Copy link"; }, 1500); };
        try { navigator.clipboard.writeText(inp.value).then(done, function () { inp.select(); try { document.execCommand("copy"); done(); } catch (e) {} }); }
        catch (e) { inp.select(); try { document.execCommand("copy"); done(); } catch (e2) {} }
        break;
      }
      case "share-link": try { navigator.share({ title: "Rumbo Español", text: "Practice Spanish for the trip with me:", url: inviteLink() }).catch(function () {}); } catch (e) {} break;
      case "group-start": S.group = { code: newGroupCode(), name: null }; save(); render(); break;
      case "group-refresh": loadGroup(true); break;
      case "group-leave": leaveGroup(); break;
      case "show-close": SHOW = null; renderShow(); break;
      case "show-prev": if (SHOW && SHOW.pos > 0) { SHOW.pos -= 1; renderShow(); } break;
      case "show-next": if (SHOW && SHOW.pos < PB.list.length - 1) { SHOW.pos += 1; renderShow(); } break;
      case "show-say": if (SHOW) { var rr = PB.list[SHOW.pos]; say(cardR(deckById(rr.d), rr.i)[0]); } break;
      case "sc-leave": stopRec(); { var fp = SC && SC.fromPlan; SC = null; if (fp) view = "home"; } render(); window.scrollTo(0, 0); break;
      case "sc-say": if (SC) say(npcText(SC.scene.turns[SC.ti])); break;
      case "sc-say-you": if (SC && SC.you && SC.you.done) say(SC.you.opts[SC.you.picked].es); break;
      case "sc-en": SC.showEn = !SC.showEn; render(); break;
      case "sc-reveal": SC.revealed = true; render(); break;
      case "sc-hide": S.hideText = !S.hideText; save(); render(); break;
      case "sc-next":
        stopRec();
        if (SC.ti >= SC.scene.turns.length - 1) { finishScene(); render(); }
        else { SC.ti += 1; beginTurn(); render(); say(npcText(SC.scene.turns[SC.ti])); }
        window.scrollTo(0, 0); break;
      case "sc-speak":
        if (SC && SC.you && SC.you.done) {
          if (SC.sp && SC.sp.listening) { stopRec(); SC.sp.listening = false; render(); break; }
          var target = SC.you.opts[SC.you.picked].es;
          SC.sp = { listening: true, heard: null, score: 0, err: null }; render();
          recognize(function (err, alts) {
            if (!SC || !SC.sp) return;
            SC.sp.listening = false;
            if (err) SC.sp.err = err; else { var r = scoreSpeech(target, alts); SC.sp.heard = r.heard; SC.sp.score = r.score; }
            render();
          });
        }
        break;
      case "start-test-x": break;
      case "study-level": view = "study"; P = null; render(); window.scrollTo(0, 0); break;
      case "leave": stopRec(); { var b = P && P.back; P = null; if (b) view = b; } render(); break;
      case "practice-all": openDeck(P.deck.id, P.mode, true, P.synth); break;
      case "flip": P.flipped = !P.flipped; render(); break;
      case "signout": doSignOut(false); break;
      case "signout-force": doSignOut(true); break;
      case "syncnow": if (A.user) { A.signoutWarn = false; push().then(function (ok) { if (ok) syncDown(); render(); }); } break;
      case "del-ask": A.confirmDelete = true; render(); break;
      case "del-no": A.confirmDelete = false; render(); break;
      case "del-yes": doDelete(); break;
      case "install": if (deferredInstall) { deferredInstall.prompt(); deferredInstall = null; renderTrip(); } break;
      case "mic": if (P && P.sp) { if (P.sp.listening) { stopRec(); P.sp.listening = false; render(); } else listen(); } break;
      case "reveal": if (P && P.sp) { P.sp.revealed = true; render(); } break;
      case "spnext":
        if (P && P.sp) {
          stopRec();
          if (!P.sp.graded) { P.sp.graded = true; gradeP(P.queue[P.pos], false); }
          P.pos += 1; resetSp(); render(); window.scrollTo(0, 0);
        }
        break;
      case "say":
        if (P && P.mode === "speak" && P.queue[P.pos] !== undefined) say(spTarget());
        else if (P && P.mode === "quiz" && P.q) say(cardR(P.deck, P.q.i)[0]);
        else if (P && P.queue[P.pos] !== undefined) say(cardR(P.deck, P.queue[P.pos])[0]);
        break;
      case "again": case "good":
        gradeP(P.queue[P.pos], ds.act === "good");
        if (ds.act === "good") P.right += 1;
        P.pos += 1; P.flipped = false; render(); break;
      case "qnext": P.pos += 1; buildQuiz(); render(); break;
    }
  });

  document.addEventListener("input", function (ev) {
    if (ev.target && ev.target.id === "pb-search") {
      PB.q = ev.target.value;
      var box = $("pb-list"); if (box) box.innerHTML = pbBody();
    }
  });
  document.addEventListener("keydown", function (ev) {
    if (ev.key === "Escape" && SHOW) { SHOW = null; renderShow(); }
  });


  document.addEventListener("submit", function (ev) {
    var f = ev.target.closest && ev.target.closest("form[data-form]");
    if (!f) return;
    ev.preventDefault();
    var kind = f.getAttribute("data-form"), fd = new FormData(f);
    if (kind === "auth") { if (A.sb) submitAuth(f); }
    else if (kind === "date") {
      var v = (fd.get("date") || "").toString();
      if (v && !/^\d{4}-\d{2}-\d{2}$/.test(v)) return;
      S.tripDate = v || null; HOME.editDate = false; save(); render();
    } else if (kind === "join") {
      var nm = (fd.get("name") || "").toString().trim().slice(0, 24);
      if (nm && S.group) { S.group.name = nm; save(); render(); loadGroup(true); }
    }
  });

  /* Invite links: ?c=mx|ec|co &d=YYYY-MM-DD &g=GROUPCODE */
  function applyLink() {
    var q, changed = false;
    try { q = new URLSearchParams(location.search); } catch (e) { return; }
    var c = q.get("c"), d = q.get("d"), g = q.get("g");
    if (c && COUNTRIES[c]) { S.country = c; changed = true; }
    if (d && /^\d{4}-\d{2}-\d{2}$/.test(d) && !isNaN(new Date(d + "T00:00:00").getTime())) { S.tripDate = d; changed = true; }
    if (g && /^[A-Z0-9]{8}$/.test(g) && (!S.group || (S.group.code !== g && !S.group.name))) {
      S.group = { code: g, name: null }; S.left = (S.left || []).filter(function (x) { return x !== g; }); changed = true;
    }
    if (changed) saveLocal();
    if ((c || d || g) && window.history && history.replaceState) { try { history.replaceState(null, "", location.pathname); } catch (e) {} }
  }
  applyLink();
  render();
  initAuth();
})();
</script>
</body>
</html>
